<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamentos - Fitness Academia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><div class="logo-icon">🏋️</div><h2>FITNESS <span>ACADEMIA</span></h2></div>
    <nav class="menu">
      <p>NAVEGAÇÃO</p>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="alunos.html">👥 Alunos</a>
      <a href="planos.html">📋 Planos</a>
      <a class="active" href="pagamentos.html">💳 Pagamentos</a>
      <a href="treinos.html">🏋️ Treinos</a>
    </nav>
    <button id="btnSair" class="btn-logout">↪ Sair</button>
  </aside>

  <main class="main-content">
    <header class="topbar"><button class="mobile-menu" id="btnMenu">☰</button><h1>Pagamentos</h1></header>

    <section class="content-grid">
      <article class="panel form-panel">
        <h2>Novo pagamento</h2>
        <form id="formPagamento">
          <label>Aluno</label>
          <select id="alunoPagamento" required></select>
          <label>Valor</label>
          <input id="valorPagamento" type="number" step="0.01" required />
          <label>Data do pagamento</label>
          <input id="dataPagamento" type="date" required />
          <label>Status</label>
          <select id="statusPagamento">
            <option value="Pago">Pago</option>
            <option value="Pendente">Pendente</option>
          </select>
          <button type="submit" class="btn-primary full">Registrar pagamento</button>
        </form>
      </article>

      <article class="panel list-panel">
        <h2>Histórico de pagamentos</h2>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Aluno</th><th>Valor</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="tabelaPagamentos"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/pagamentos.js"></script>
</body>
</html>
