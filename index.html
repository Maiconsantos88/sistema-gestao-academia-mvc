<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Fitness Academia</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <main class="login-container">
      <section class="login-card">
        <div class="logo-login">
          <div class="logo-icon">🏋️</div>
          <h1>FITNESS <span>ACADEMIA</span></h1>
        </div>

        <p class="login-subtitle">Acesse sua conta para continuar</p>

        <form id="formLogin">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            placeholder="seuemail@exemplo.com"
            required
          />

          <label for="senha">Senha</label>
         <input type="password" id="senha" placeholder="Digite sua senha" required />
          <div id="campo2FA" style="display: none">
            <label for="codigo2FA">Código de verificação</label>
            <input
              type="text"
              id="codigo2FA"
              placeholder="000000"
              maxlength="6"
              inputmode="numeric"
              autocomplete="one-time-code"
            />
          </div>

          <button type="submit" class="btn-primary full">Entrar</button>
        </form>
      </section>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
