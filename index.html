<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Fitness Academia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-card">
      <div class="logo-login">
        <div class="logo-icon">🏋️</div>
        <h1>FITNESS <span>ACADEMIA</span></h1>
      </div>

      <p class="login-subtitle">Acesse sua conta para continuar</p>

      <form id="formLogin">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="admin@academia.com" required />

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="123456" required />

        <button type="submit" class="btn-primary full">Entrar</button>
      </form>

      <div class="login-info">
        <strong>Usuário de teste:</strong><br />
        admin@academia.com<br />
        Senha: 123456
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
