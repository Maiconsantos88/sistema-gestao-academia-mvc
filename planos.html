<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planos - Fitness Academia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><div class="logo-icon">🏋️</div><h2>FITNESS <span>ACADEMIA</span></h2></div>
    <nav class="menu">
      <p>NAVEGAÇÃO</p>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="alunos.html">👥 Alunos</a>
      <a class="active" href="planos.html">📋 Planos</a>
      <a href="pagamentos.html">💳 Pagamentos</a>
      <a href="treinos.html">🏋️ Treinos</a>
    </nav>
    <button id="btnSair" class="btn-logout">↪ Sair</button>
  </aside>

  <main class="main-content">
    <header class="topbar"><button class="mobile-menu" id="btnMenu">☰</button><h1>Planos</h1></header>

    <section class="content-grid">
      <article class="panel form-panel">
        <h2>Novo plano</h2>
        <form id="formPlano">
          <input type="hidden" id="planoId" />
          <label>Nome do plano</label>
          <input id="nomePlano" type="text" placeholder="Ex: Musculação" required />
          <label>Valor mensal</label>
          <input id="valorPlano" type="number" step="0.01" placeholder="149.90" required />
          <label>Duração</label>
          <select id="duracaoPlano">
            <option>Mensal</option>
            <option>Trimestral</option>
            <option>Semestral</option>
            <option>Anual</option>
          </select>
          <div class="form-actions">
            <button type="button" id="btnCancelar" class="btn-secondary">Cancelar</button>
            <button type="submit" class="btn-primary">Salvar plano</button>
          </div>
        </form>
      </article>

      <article class="panel list-panel">
        <h2>Planos cadastrados</h2>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Plano</th><th>Valor</th><th>Duração</th><th>Ações</th></tr></thead>
            <tbody id="tabelaPlanos"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/planos.js"></script>
</body>
</html>
